<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedding Test</title>
</head>
<body>
    <h3>Embedded site</h3>
    <div>
        URL <input type="text" id="urlInput" value="https://example.com" style="width: 80%;">
        <!-- <br>This iframe could be hidden: -->
         <br><br>
        <iframe id="embedFrame" src="https://example.com" width="50%" height="35%" style="border: none;"></iframe>
    </div>
    <h3>Token</h3>
    <div id="tokenDisplay" style="margin-top: 20px;">
        None
    </div>
    <h3>Messages</h3>
    <div id="msgDisplay" style="margin-top: 20px;">
        None
    </div>
    <script>
        // When urlInput changes, update the iframe src
        document.getElementById('urlInput').addEventListener('input', function() {
            const newUrl = this.value;
            document.getElementById('embedFrame').src = newUrl;
        });

        // Listen for messages from the iframe
        let msgCount = 0;
        window.onmessage = function(event) {
            console.log('Received message:', event.data);
            msgCount++;
            document.getElementById('msgDisplay').innerHTML += `<p>${msgCount}:<br>${JSON.stringify(event.data)}</p>`;
            if (event.data.token) {
                // decode JWT
                const tokenParts = event.data.token.split('.');
                if (tokenParts.length === 3) {
                    const payload = JSON.parse(atob(tokenParts[1]));
                    document.getElementById('tokenDisplay').innerHTML = `
                        <h3>The site sent me this token</h3>
                        <pre>${JSON.stringify(payload, null, 2)}</pre>
                    `;
                } else {
                    document.getElementById('tokenDisplay').innerHTML = '<p>Invalid token format.</p>';
                }
            }
        };
    </script>
</body>
</html>
